[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser_service"
version = "0.1.0"
description = "Persistent Chrome session exposed as REST API and MCP tool server"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=0.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["browser_service*"]
